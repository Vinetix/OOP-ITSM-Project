spring.application.name=itsm

# ------------------------------------------------------------------
# Secrets (DB password, JWT secret) live in application-local.properties,
# which is git-ignored. Each teammate keeps their own copy.
# Copy application-local.properties.example -> application-local.properties
# ------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
# Set to true while debugging queries. Left off because the SLA monitor (Phase 6)
# runs every minute and would flood the console.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Store all timestamps in UTC; the frontend converts to local time for display.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Entities are converted to DTOs inside service methods, so we don't need
# lazy-loading during the web request (also removes a startup warning).
spring.jpa.open-in-view=false
# Loads lazy collections (e.g. technicians' skills) in batches instead of one query per row (avoids N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------- Application settings (see config/AppProperties) ----------------
app.jwt.expiration-minutes=480
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
# Creates demo users (and later services, SLA policies, incidents) when tables are empty
app.seed.enabled=true

# ---------------- Swagger UI ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Keeps the JWT you paste into "Authorize" after a page refresh
springdoc.swagger-ui.persist-authorization=true
