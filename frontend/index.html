<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="I-ITSM: report, track and resolve IT incidents." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,300..900;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>I-ITSM</title>
    <!-- before anything paints: apply the saved theme (or the system's), so dark mode never flashes light -->
    <style>
      html { background: #e3e6df; }
      html.dark { background: #121815; }
    </style>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('itsm-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
